name: manual-artifact

on: [ workflow_dispatch ]
jobs:
  build:
    runs-on: ubuntu-latest
   
    strategy:
      matrix:
        include:
          - target: 1.20.1-fabric
          - target: 1.21.1-fabric
          - target: 1.20.1-neoforge
          - target: 1.21.1-neoforge
          
    steps:
      - name: Checkout sources
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 25

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: false
          cache-cleanup: always

      - name: Gradle build
        run: ./gradlew build
     
      - uses: actions/upload-artifact@v4
        with:
          name: voxy-fabric-1.20.1
          path: versions/1.20.1-fabric/build/libs/*.jar
      
      - uses: actions/upload-artifact@v4
        with:
          name: voxy-neoforge-1.20.1
          path: versions/1.20.1-neoforge/build/libs/*.jar

      - uses: actions/upload-artifact@v4
        with:
          name: voxy-fabric-1.21.1
          path: versions/1.21.1-fabric/build/libs/*.jar
      
      - uses: actions/upload-artifact@v4
        with:
          name: voxy-neoforge-1.21.1
          path: versions/1.21.1-neoforge/build/libs/*.jar
